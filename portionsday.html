<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieTracker - Daily Portions</title>
    <link rel="stylesheet" href="styles-intro.css">
    <link rel="stylesheet" href="styles-input.css">
    <link rel="stylesheet" href="styles-advanced.css">
    <link rel="stylesheet" href="styles-result.css">
    <link rel="stylesheet" href="styles-weightgoals.css">
    <link rel="stylesheet" href="macronutrients.css">
</head>
<body>
    <header>
        <h1>
            CalorieTracker - Daily Portions
            <span class="step-chip">Plan</span>
        </h1>
    </header>
    <main>
        <div id="portions" class="section">
            <!-- Výsledky porcí se zde zobrazí -->
        </div>
        <div class="button-container">
            <button type="button" class="btn" onclick="goToMacronutrientsDay()">Continue</button>
        </div>
    </main>
    <footer>
        <p>&copy; Visit my Portfolio <a href="https://veronikaobrtelova.netlify.app/" target="_blank">website</a>.</p>
    </footer>
    <script>
        function getQueryParams() {
            const params = {};
            const search = window.location.search.substring(1);
            if (!search) return params;

            search.split("&").forEach(param => {
                if (!param) return;
                const [key, value] = param.split("=");
                if (!key) return;
                params[key] = decodeURIComponent(value || "");
            });

            return params;
        }

        function getTotalCalories(params) {
            const queryCalories = parseFloat(params.calories || "");
            if (Number.isFinite(queryCalories) && queryCalories > 0) {
                return queryCalories;
            }

            const savedCalories = parseFloat(localStorage.getItem('totalCalories') || "");
            if (Number.isFinite(savedCalories) && savedCalories > 0) {
                return savedCalories;
            }

            return 2000;
        }

        function displayPortions() {
            const params = getQueryParams();
            const totalCalories = getTotalCalories(params);

            const meals = [
                { name: 'Breakfast', ratio: 0.21 },
                { name: 'Snack 1', ratio: 0.13 },
                { name: 'Lunch', ratio: 0.27 },
                { name: 'Snack 2', ratio: 0.18 },
                { name: 'Dinner', ratio: 0.20 }
            ];

            let portionsHtml = '';
            meals.forEach(meal => {
                const mealCalories = totalCalories * meal.ratio;

                portionsHtml += `
                    <div class="result-item" title="${meal.name} intake">
                        <h2>${meal.name}</h2>
                        <p>Calories: ${mealCalories.toFixed(2)} kcal</p>
                    </div>
                `;
            });

            document.getElementById('portions').innerHTML = portionsHtml;
            localStorage.setItem('totalCalories', String(Math.round(totalCalories)));
            return totalCalories;
        }

        function goToMacronutrientsDay() {
            const totalCalories = displayPortions();
            const url = new URL('macronutrientsday.html', window.location.href);
            url.searchParams.set('totalCalories', String(Math.round(totalCalories)));
            window.location.href = url.toString();
        }

        displayPortions();
    </script>
</body>
</html>
