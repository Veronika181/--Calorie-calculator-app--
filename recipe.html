<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipe.css">
</head>
<body>
    <header>
        <h1>Recipes</h1>
    </header>

    <main>
        <div class="navigation-arrows">
            <button class="arrow-button" type="button" onclick="prevRecipe()" aria-label="Previous recipe">&larr;</button>
            <button class="arrow-button" type="button" onclick="nextRecipe()" aria-label="Next recipe">&rarr;</button>
        </div>

        <div class="recipe-container">
            <div class="recipe-card">
                <img class="recipe-image" src="menu.png" alt="Recipe image">

                <div class="recipe-header">
                    <h2 class="recipe-title" onclick="toggleDetails(this)">Recipe</h2>
                    <button class="edit-button" type="button" onclick="toggleDetails(this.previousElementSibling)">Details</button>
                </div>

                <div class="recipe-details open">
                    <div class="recipe-meta"></div>

                    <div class="ingredients-container"></div>

                    <div class="instruction"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="recipe.js"></script>
</body>
</html>
