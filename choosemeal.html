<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Meal</title>
    <link rel="stylesheet" href="styles-advanced.css">
    <link rel="stylesheet" href="choosemeal.css">
    <link rel="stylesheet" href="macronutrients.css">
    <link rel="stylesheet" href="extendedmenu.css">
    <style>
    </style>
</head>
<body>
    <h1>Choose Your Meal</h1>
    <main>
        <div class="meal-options">
            <div id="breakfast" class="meal-option" onclick="showMeals('breakfast')">Breakfast</div>
            <div id="lunch" class="meal-option" onclick="showMeals('lunch')">Lunch</div>
            <div id="dinner" class="meal-option" onclick="showMeals('dinner')">Dinner</div>
        </div>
        <div id="meal-images" class="meal-images">
            <!-- Images and names will be displayed here -->
        </div>
        <button type="button" class="btn" onclick="goToRecipePage()">Next</button>
        <p id="mealValidation" class="inline-validation" aria-live="polite"></p>
    </main>
    <script src="choosemeal.js"></script>
</body>
</html>
