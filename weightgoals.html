<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieTracker – Weight Goals</title>

    <!-- UI KIT -->
    <link rel="stylesheet" href="ui-kit.css">

    <!-- Styl pro tuto stránku -->
    <link rel="stylesheet" href="styles-weightgoals.css">

    <!-- Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- Přepínač tématu -->
    <button id="themeToggle" class="theme-toggle">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Header -->
    <header>
        <h1>
            <img src="logo.svg" class="logo" alt="logo">
            CalorieTracker - Weight Goals
            <span class="step-chip">Step 4 of 6</span>
        </h1>
    </header>

    <!-- Main -->
    <main>

        <!-- SECTION 1 -->
        <div class="section card-3d">
            <h2>What would you like to do with your weight?</h2>

            <div class="btn-group">
                <button class="goal-btn" data-title="Reduce" onclick="selectGoal('Reduce', this)">Reduce</button>
                <button class="goal-btn" data-title="Maintain" onclick="selectGoal('Maintain', this)">Maintain</button>
                <button class="goal-btn" data-title="Gain" onclick="selectGoal('Gain', this)">Gain</button>
            </div>
        </div>

        <!-- SECTION 2 -->
        <div class="section card-3d">
            <h2>Calorie Deficit Level</h2>

            <div class="btn-group">
                <button class="deficit-btn" data-title="Low" onclick="selectDeficit('Low', this)">Low</button>
                <button class="deficit-btn" data-title="Medium" onclick="selectDeficit('Medium', this)">Medium</button>
                <button class="deficit-btn" data-title="High" onclick="selectDeficit('High', this)">High</button>
            </div>
        </div>

        <!-- NEXT BUTTON -->
        <div class="button-container">
            <button type="button" class="btn" onclick="nextPage()">
                <i class="fa-solid fa-arrow-right"></i> Continue
            </button>
        </div>

        <p id="goalValidation" class="inline-validation" aria-live="polite"></p>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; Visit my Portfolio 
            <a href="https://veronikaobrtelova.netlify.app/" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> website
            </a>
        </p>
    </footer>

    <!-- Logika -->
    <script>
        let weightGoal = "";
        let deficitAmount = "";

        function selectGoal(goal, btn) {
            weightGoal = goal;
            document.querySelectorAll(".goal-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            showGoalValidation("");
        }

        function selectDeficit(deficit, btn) {
            deficitAmount = deficit;
            document.querySelectorAll(".deficit-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            showGoalValidation("");
        }

        function showGoalValidation(message) {
            const el = document.getElementById("goalValidation");
            if (!el) return;
            el.textContent = message;
            el.style.display = message ? "block" : "none";
        }

        function nextPage() {
            if (weightGoal && deficitAmount) {
                const url = `ratioofmacronutrients.html?goal=${weightGoal}&deficit=${deficitAmount}`;
                location.href = url;
            } else {
                showGoalValidation("Please select both goal and deficit level to continue.");
            }
        }
    </script>

    <!-- Theme toggle -->
    <script src="theme.js"></script>

</body>
</html>
