<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ui-kit.css">
    <title>Notifications</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(150deg, #c9e8d2 0%, #d9efdf 42%, #e8f7ec 100%);
            margin: 0;
        }
        .container {
            background: var(--kt-white);
            padding: 20px;
            box-shadow: var(--kt-shadow-md);
            border-radius: 8px;
            width: 300px;
            border: 1px solid var(--kt-border);
        }
        h2 {
            margin-top: 0;
            text-align: center;
        }
        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu a {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            text-align: center;
            text-decoration: none;
            color: var(--kt-white);
            background-color: var(--kt-green);
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .menu a:hover {
            background-color: var(--kt-green-dark);
        }
        .menu a.sign-out,
        .menu a.delete-account {
            background-color: #dc3545;
        }
        .menu a.sign-out:hover,
        .menu a.delete-account:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Notifications</h2>
        <div class="menu">
            <a href="changes.html">Profile Changes</a>
            <a href="mytargets.html">My Targets</a>
            <a href="mynutrition.html">My Nutrition</a>
            <a href="notificationonoff.html">Notification Settings</a>
            <a href="changepassword.html">Change Password</a>
            <a href="login.html" class="sign-out">Sign Out</a>
            <a href="index.html" class="delete-account">Delete Account</a>
        </div>
    </div>
</body>
</html>
