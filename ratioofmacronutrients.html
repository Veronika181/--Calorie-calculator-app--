<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker – Macronutrient Ratios</title>

    <link rel="stylesheet" href="ratioofmacronutrients.css">
    <link rel="stylesheet" href="styles-advanced.css">
    <link rel="stylesheet" href="styles-result.css">
    <link rel="stylesheet" href="styles-weightgoals.css">
    <link rel="stylesheet" href="macronutrients.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <main>
        <div class="section card-3d">

            <h2 class="result-title">Set Your Macronutrient Ratios</h2>

            <div class="macro-inputs">

                <div class="macro-group">
                    <label for="protein">Protein (%)</label>
                    <input type="number" id="protein" min="0" max="100" value="30">
                </div>

                <div class="macro-group">
                    <label for="carbs">Carbs (%)</label>
                    <input type="number" id="carbs" min="0" max="100" value="40">
                </div>

                <div class="macro-group">
                    <label for="fat">Fat (%)</label>
                    <input type="number" id="fat" min="0" max="100" value="30">
                </div>

            </div>

            <!-- Calculate -->
            <div class="button-container">
                <button class="btn" onclick="calculateMacros()">
                    <i class="fa-solid fa-calculator"></i> Calculate
                </button>
            </div>

            <!-- Result -->
            <div id="result" class="section"></div>

            <!-- Next -->
            <div class="button-container">
                <button class="btn" onclick="resultRatioOfMacronutrients()">
                    <i class="fa-solid fa-arrow-right"></i> Next
                </button>
            </div>

            <!-- Back -->
            <div class="button-container" style="margin-bottom: 2rem;">
                <button class="btn" onclick="window.history.back()">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="ratioofmacronutrients.js"></script>
    <script src="script.js"></script>

</body>
</html>
