<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieTracker</title>

    <link rel="stylesheet" href="ui-kit.css">
    <link rel="stylesheet" href="styles-index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <button id="themeToggle" class="theme-toggle"><i class="fa-solid fa-moon"></i></button>

    <header>
        <h1><img src="logo.svg" class="logo"> CalorieTracker</h1>
    </header>

    <main>
        <div class="section card-3d">
            <img src="menu.png" class="intro-img">

            <div class="intro-text">
                <h2>Track your calories easily</h2>
                <p>Start your journey to a healthier lifestyle.</p>

                <button class="btn btn-pulse start-btn">
                    <i class="fa-solid fa-play"></i> Start
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Visit my Portfolio 
            <a href="https://veronikaobrtelova.netlify.app/" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> website
            </a>
        </p>
    </footer>

    <script>
        // Ensuite button is loaded before attaching listener
        const startBtn = document.querySelector(".start-btn");
        if (startBtn) {
            startBtn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log("Start button clicked!");
                window.location.href = "input.html";
            });
        } else {
            console.error("Start button not found!");
        }
    </script>
</body>
</html>
