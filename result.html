<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieTracker – Result</title>

    <link rel="stylesheet" href="ui-kit.css">
    <link rel="stylesheet" href="styles-result.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="calculateCalories()">
    <button id="themeToggle" class="theme-toggle"><i class="fa-solid fa-moon"></i></button>

    <header>
        <h1><img src="logo.svg" class="logo"> CalorieTracker</h1>
    </header>

    <main>
        <div id="result" class="section card-3d">

            <!-- Progress Ring -->
            <div class="progress-ring">
                <svg>
                    <circle class="bg"></circle>
                    <circle class="progress"></circle>
                </svg>
                <div class="value" id="calorieValue">0</div>
            </div>

            <h2 class="result-title">Your Personalized Calorie Target</h2>

            <button class="btn" onclick="location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; Visit my Portfolio 
            <a href="https://veronikaobrtelova.netlify.app/" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> website
            </a>
        </p>
    </footer>

    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
