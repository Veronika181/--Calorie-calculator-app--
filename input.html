<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieTracker – Vstup</title>

    <link rel="stylesheet" href="ui-kit.css">
    <link rel="stylesheet" href="styles-input.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <button id="themeToggle" class="theme-toggle"><i class="fa-solid fa-moon"></i></button>

    <header>
        <h1><img src="logo.svg" class="logo"> CalorieTracker</h1>
    </header>

    <main>
        <div class="section card-3d">

            <!-- Gender -->
            <div class="gender-container">
                <div class="gender-option">
                    <button class="gender-btn" onclick="selectGender('male')">
                        <i class="fa-solid fa-person"></i> Man
                    </button>
                </div>

                <div class="gender-option">
                    <button class="gender-btn" onclick="selectGender('female')">
                        <i class="fa-solid fa-person-dress"></i>Women
                    </button>
                </div>
            </div>

            <!-- Height -->
            <div class="input-container">
                <div class="input-group">
                    <label>Height</label>
                    <div class="height-group">
                        <span id="heightDisplay">175 cm</span>
                        <input type="range" id="height" min="100" max="250" value="175" oninput="updateHeightDisplay()">
                    </div>
                </div>
            </div>

            <!-- Age + Weight -->
            <div class="input-container">
                <div class="input-group">
                    <label>Age</label>
                    <div class="number-group">
                        <button onclick="changeValue('age', -1)">-</button>
                        <span id="ageDisplay">28</span>
                        <button onclick="changeValue('age', 1)">+</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Weight</label>
                    <div class="number-group">
                        <button onclick="changeValue('weight', -1)">-</button>
                        <span id="weightDisplay">78</span>
                        <button onclick="changeValue('weight', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button class="btn" onclick="saveDataInputOnPage()">
                    <i class="fa-solid fa-arrow-right"></i>Next
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Visit my Portfolio 
            <a href="https://veronikaobrtelova.netlify.app/" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> website
            </a>
        </p>
    </footer>

    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
