<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Page</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="styles-intro.css">
    <link rel="stylesheet" href="styles-input.css">
</head>

<body class="input">
    <header>
        <h1><i class="fa-solid fa-fire-flame-curved"></i> CalorieTracker</h1>
    </header>

    <main>
        <div id="input" class="section">

            <!-- Gender selection -->
            <div class="input-container gender-container">
                <div class="input-group gender-option">
                    <button id="maleBtn" class="gender-btn" onclick="selectGender('male')">
                        <i class="fa-solid fa-person"></i> Male
                    </button>
                    <img src="../images/Vector.png" alt="male" class="gender-img"/>
                </div>

                <div class="input-group gender-option">
                    <button id="femaleBtn" class="gender-btn" onclick="selectGender('female')">
                        <i class="fa-solid fa-person-dress"></i> Female
                    </button>
                    <img src="../images/Vector2.png" alt="female" class="gender-img"/>
                </div>
            </div>

            <!-- Height -->
            <div class="input-container mt-20">
                <div class="input-group">
                    <label for="height">Height</label>
                    <div class="input-group height-group">
                        <span id="heightDisplay">175 cm</span>
                        <input type="range" id="height" name="height" min="100" max="250" value="175" oninput="updateHeightDisplay()">
                    </div>
                </div>
            </div>

            <!-- Age + Weight -->
            <div class="input-container mt-20">
                <div class="input-group">
                    <label for="age">Age</label>
                    <div class="input-group number-group">
                        <button type="button" class="age-btn-left" onclick="changeValue('age', -1)">-</button>
                        <span id="ageDisplay">28</span>
                        <button type="button" class="age-btn-right" onclick="changeValue('age', 1)">+</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="weight">Weight</label>
                    <div class="input-group number-group">
                        <button type="button" class="weight-btn-left" onclick="changeValue('weight', -1)">-</button>
                        <span id="weightDisplay">78</span>
                        <button type="button" class="weight-btn-right" onclick="changeValue('weight', 1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Next button -->
            <div class="button-container">
                <button type="button" class="btn" onclick="saveDataInputOnPage()">
                    <i class="fa-solid fa-arrow-right"></i> Next
                </button>
            </div>
        </div>

        <!-- Result section (hidden) -->
        <div id="result" class="section" style="display:none;">
            <div id="calorieResult"></div>
        </div>
    </main>

    <footer>
        <p>&copy; Visit my Portfolio 
            <a href="https://veronikaobrtelova.netlify.app/" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> website
            </a>.
        </p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
